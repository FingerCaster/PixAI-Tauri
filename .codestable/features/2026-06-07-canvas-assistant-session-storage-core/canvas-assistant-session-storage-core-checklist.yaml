  - item: "消息超过默认页大小时打开只加载最近页，点击加载更多能取回更早消息且顺序正确"
    source: 验收场景
    status: passed
  - item: "清空当前聊天后助手回到欢迎态，当前项目 nodes/connections/viewport 不变"
    source: 验收场景
    status: passed
  - item: "删除 Canvas project 后对应助手会话消息被删除，其他项目消息不受影响"
    source: 验收场景
    status: passed
  - item: "导出 Canvas project JSON 不默认包含聊天历史"
    source: 验收场景
