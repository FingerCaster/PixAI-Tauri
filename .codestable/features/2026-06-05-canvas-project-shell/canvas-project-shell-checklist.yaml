feature: 2026-06-05-canvas-project-shell
created: 2026-06-05

steps:
  - action: "名词骨架：补 Canvas project 类型、Canvas service API 和独立 store 的空实现"
    exit_signal: "类型检查能识别 CanvasProject、pixaiApi.canvas 和 useCanvasStore"
    status: done

  - action: "持久化节点：实现 Canvas project list/get/create/update/delete 和默认项目创建"
    exit_signal: "service/store 测试覆盖首次创建、恢复项目、更新 viewport"
    status: done

  - action: "页面静态结构：新增 CanvasWorkspace、CanvasViewport、项目标题区和空画布背景"
    exit_signal: "切到 canvas 后能看到完整 Canvas 页面，不白屏"
    status: done

  - action: "交互逻辑：接入拖拽平移、滚轮缩放、重置视图"
    exit_signal: "手工操作能改变视口，UI 显示的缩放值同步变化"
    status: done

  - action: "状态接入：CanvasWorkspace mount 时加载/创建默认项目，视口变化持久化"
    exit_signal: "切走、刷新、重进后保留项目和 viewport"
    status: done

  - action: "验证收尾：补路由 smoke、store/service 测试，跑 pnpm check"
    exit_signal: "测试与类型检查通过，关键验收场景有证据"
    status: done

