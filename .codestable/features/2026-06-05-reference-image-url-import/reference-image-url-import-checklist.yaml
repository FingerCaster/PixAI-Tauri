feature: 2026-06-05-reference-image-url-import
created: 2026-06-05

steps:
  - action: "交互骨架：新增链接导入按钮和弹窗输入，不接真实下载"
    exit_signal: "用户能打开和关闭链接导入弹窗，空输入不会触发导入"
    status: done
  - action: "下载转换节点：实现 URL 校验、HTTP 下载、20MB 大小拦截、MIME / 文件名推断和 data URL 转换"
    exit_signal: "有效图片 URL 能转换为 ReferenceImageFilePayload，无效协议、非图片响应和超过 20MB 的响应有明确错误"
    status: done
  - action: "状态接入：把转换结果接入 importReferencePayloads，保留加载态和失败提示"
    exit_signal: "成功导入后当前会话缩略条追加参考图，失败不改变会话"
    status: done
  - action: "测试覆盖：补齐平台转换和 Composer URL 导入交互测试"
    exit_signal: "正常 URL、无效 URL、非图片响应、超限响应和导入失败路径都有验证证据"
    status: done
  - action: "文档对齐：更新 reference-image-input requirement 和 UI 架构文档"
    exit_signal: "需求边界不再与 URL 导入冲突，架构文档记录 Composer 可显式导入远程图片"
    status: done

checks:
  - item: "图片 URL 导入沿用 ReferenceImageFilePayload，不新增远程参考图或 URL 参考图实体"
    source: 名词契约
    status: passed
  - item: "readRemoteImageUrl 输入 HTTP/HTTPS 图片 URL，输出 name、mimeType、dataUrl、fileSizeBytes"
    source: 名词契约
    status: passed
  - item: "URL 下载在 Content-Length 超过 20MB 时直接拒绝"
    source: 流程级约束
    status: passed
  - item: "URL 下载在缺失或不可信 Content-Length 时，累计下载超过 20MB 必须中止"
    source: 流程级约束
    status: passed
  - item: "URL 导入成功后调用 importReferencePayloads 并由 AppDatabase.importReferenceImages 校验格式、大小和数量"
    source: 编排骨架
    status: passed
