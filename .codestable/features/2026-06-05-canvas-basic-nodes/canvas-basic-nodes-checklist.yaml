feature: 2026-06-05-canvas-basic-nodes
created: 2026-06-05

steps:
  - action: "节点名词骨架：升级共享类型、CanvasProjectInput 和 service normalize/clone"
    exit_signal: "旧 project 仍能加载，新 nodes/connections 可被 service 创建、更新、列摘要"
    status: done

  - action: "Store 计算节点：新增 add/update/move/delete node 与 add/delete connection actions"
    exit_signal: "store 测试覆盖新增文本、图片、移动、删除节点和去重连线"
    status: done

  - action: "Canvas UI 静态结构：新增工具条入口、节点卡片、图片预览、SVG 连线层"
    exit_signal: "Canvas 页面能渲染 text/image 节点和基础连线，不白屏"
    status: done

  - action: "交互逻辑：接入节点选择、拖动提交、文本编辑、连接 handle、删除节点/连线"
    exit_signal: "用户操作能改变 nodes/connections，并显示选中态"
    status: done

  - action: "持久化联调：节点/连线更新写回 Canvas project，刷新或重进后恢复"
    exit_signal: "浏览器 smoke 证明添加、移动、连接、删除和刷新恢复成立"
    status: done

  - action: "验证收尾：补 service/store/component 测试，跑 pnpm check 和 pnpm build"
    exit_signal: "测试、类型检查、构建通过，关键验收场景有证据"
    status: done

