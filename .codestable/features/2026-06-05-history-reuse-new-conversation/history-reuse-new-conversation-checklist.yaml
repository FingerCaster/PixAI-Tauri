steps:
  - action: "名词契约：让会话创建链路支持 draftPrompt/title/referenceImages 初始化"
    exit_signal: "直接创建会话时能得到带 prompt 和参考图的 conversation"
    status: done
  - action: "编排骨架：把 Gallery 历史动作从更新 active conversation 改为创建并激活新 conversation"
    exit_signal: "点击后 activeConversationId 变为新 id，点击前会话对象不变"
    status: done
  - action: "参考图恢复：从历史项复制可恢复的原始 referenceImages，并处理全部或部分缺失提示"
    exit_signal: "图生图历史的新会话显示参考图，缺失参考图有可见 toast"
    status: done
  - action: "UI 语义收口：更新 Gallery 按钮文案，并保持复制提示词和作为参考图编辑的独立语义"
    exit_signal: "Gallery 中不再出现“回填参数”，复制提示词仍只复制剪贴板"
    status: done
  - action: "测试覆盖：补齐 store 和 Gallery 组件关键场景"
    exit_signal: "text-to-image、image-to-image、缺失参考图、当前会话不变、按钮文案测试通过"
    status: done
  - action: "文档对齐：实现验收时更新 requirement 状态与 UI 架构文档"
    exit_signal: "架构文档不再描述 Gallery “回填参数”，需求从 draft 升为 current"
    status: done

